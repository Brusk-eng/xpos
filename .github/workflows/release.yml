name: Generate Semantic Release

on:
  push:
    branches:
      - version-16

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-xpos
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pos.xconsol.com
    timeout-minutes: 15
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    env:
      RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ env.RELEASE_AUTH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup dependencies
        run: |
          npm install @semantic-release/git @semantic-release/exec --no-save

      - name: Show token source
        run: |
          set -e
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            echo "Using RELEASE_TOKEN secret for semantic-release"
          else
            echo "RELEASE_TOKEN is not set; falling back to github.token"
          fi

      - name: Capture current release tag
        id: pretag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ env.RELEASE_AUTH_TOKEN }}
          GIT_AUTHOR_NAME: "POS Bot"
          GIT_AUTHOR_EMAIL: "ar.frappe.dev@gmail.com"
          GIT_COMMITTER_NAME: "POS Bot"
          GIT_COMMITTER_EMAIL: "ar.frappe.dev@gmail.com"
        run: npx semantic-release

      - name: Detect published version
        id: version
        run: |
          set -e
          git fetch --tags --force
          NEWTAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$NEWTAG" != "none" ] && [ "$NEWTAG" != "${{ steps.pretag.outputs.tag }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEWTAG#v}" >> "$GITHUB_OUTPUT"
            echo "Released new version: ${NEWTAG#v}"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No new release was created."
          fi

  release-notes:
    name: Release Notes
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release_notes.yml
    with:
      tag_name: v${{ needs.release.outputs.version }}
    secrets: inherit
